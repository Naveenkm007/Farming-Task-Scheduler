<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Book Return Tracker</title>
  <style>
    :root {
      --ink: #202a35;
      --muted: #687582;
      --paper: #fffdf8;
      --line: #e4e0d7;
      --navy: #17324d;
      --blue: #2e6f95;
      --gold: #d7a542;
      --green: #2f8061;
      --red: #b8554c;
      --shadow: 0 18px 45px rgba(37, 45, 56, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background: #f3f0e9;
    }
    .container { max-width: 1180px; margin: 0 auto; padding: 28px 22px 44px; }
    header {
      padding: 34px 36px;
      color: #fff;
      border-radius: 6px;
      background: linear-gradient(120deg, #17324d, #285674);
      box-shadow: var(--shadow);
    }
    .eyebrow { margin: 0 0 10px; color: #f4d38a; font: 700 0.78rem Arial, sans-serif; letter-spacing: 0.13em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3.3rem); font-weight: 500; }
    header p { margin: 0; color: #d9e3eb; font: 1rem Arial, sans-serif; }
    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 22px 0; }
    .stat { padding: 18px 20px; border-top: 4px solid var(--blue); background: var(--paper); box-shadow: var(--shadow); }
    .stat:nth-child(2) { border-color: var(--gold); }
    .stat:nth-child(3) { border-color: var(--red); }
    .stat:nth-child(4) { border-color: var(--green); }
    .stat-label { color: var(--muted); font: 700 0.78rem Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    .stat-value { display: block; margin-top: 8px; color: var(--navy); font-size: 2.1rem; }
    .layout { display: grid; grid-template-columns: 330px 1fr; gap: 22px; align-items: start; }
    .panel { padding: 24px; background: var(--paper); box-shadow: var(--shadow); }
    h2 { margin: 0 0 20px; color: var(--navy); font-size: 1.45rem; font-weight: 500; }
    form { display: grid; gap: 13px; }
    label { display: grid; gap: 6px; color: var(--muted); font: 700 0.8rem Arial, sans-serif; }
    input, select, button { font: 0.95rem Arial, sans-serif; }
    input, select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: #fff; }
    input:focus, select:focus { outline: 2px solid #b7d1df; border-color: var(--blue); }
    button { padding: 11px 15px; border: 0; border-radius: 3px; cursor: pointer; }
    .primary { margin-top: 5px; color: #fff; background: var(--blue); font-weight: 700; }
    .primary:hover { background: var(--navy); }
    .toolbar { display: flex; gap: 10px; margin-bottom: 18px; }
    .toolbar input { flex: 1; }
    .toolbar select { max-width: 170px; }
    .book-list { display: grid; gap: 12px; }
    .book { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 17px; border: 1px solid var(--line); border-left: 5px solid var(--blue); background: #fff; }
    .book.overdue { border-left-color: var(--red); }
    .book.returned { border-left-color: var(--green); opacity: 0.82; }
    .book-title { margin: 0 0 5px; color: var(--navy); font-size: 1.15rem; }
    .book-author { margin: 0 0 12px; color: var(--muted); font-style: italic; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; color: var(--muted); font: 0.82rem Arial, sans-serif; }
    .meta span { padding: 6px 8px; background: #f1f3f1; }
    .status { align-self: start; padding: 6px 9px; border-radius: 20px; font: 700 0.72rem Arial, sans-serif; text-transform: uppercase; }
    .status-borrowed { color: #895f0d; background: #fff0c8; }
    .status-overdue { color: #923c35; background: #f9d8d4; }
    .status-returned { color: #236249; background: #d8eee4; }
    .book-actions { grid-column: 1 / -1; display: flex; gap: 8px; }
    .return-btn { color: #fff; background: var(--green); }
    .delete-btn { color: var(--red); background: #fae9e6; }
    .empty { padding: 35px 10px; color: var(--muted); text-align: center; font-style: italic; }
    @media (max-width: 800px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .container { padding: 14px 12px 30px; }
      header { padding: 26px 22px; }
      .toolbar { flex-direction: column; }
      .toolbar select { max-width: none; }
      .book { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">Library desk</p>
      <h1>Book Return Tracker</h1>
      <p>Keep borrowed books visible, accountable, and ready for their next reader.</p>
    </header>

    <section class="summary" aria-label="Library summary">
      <div class="stat"><span class="stat-label">Borrowed</span><strong class="stat-value" id="borrowedCount">0</strong></div>
      <div class="stat"><span class="stat-label">Due soon</span><strong class="stat-value" id="dueSoonCount">0</strong></div>
      <div class="stat"><span class="stat-label">Overdue</span><strong class="stat-value" id="overdueCount">0</strong></div>
      <div class="stat"><span class="stat-label">Returned</span><strong class="stat-value" id="returnedCount">0</strong></div>
    </section>

    <section class="layout">
      <section class="panel">
        <h2>Record a loan</h2>
        <form id="bookForm">
          <label>Book title <input id="title" required placeholder="e.g. The Alchemist"></label>
          <label>Author <input id="author" required placeholder="e.g. Paulo Coelho"></label>
          <label>Borrower <input id="borrower" required placeholder="Member name"></label>
          <label>Return date <input id="returnDate" type="date" required></label>
          <button class="primary" type="submit">Add borrowed book</button>
        </form>
      </section>

      <section class="panel">
        <h2>Loan register</h2>
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search title, author, or borrower" aria-label="Search loans">
          <select id="filter" aria-label="Filter loans">
            <option value="All">All loans</option>
            <option value="Borrowed">Borrowed</option>
            <option value="Due soon">Due soon</option>
            <option value="Overdue">Overdue</option>
            <option value="Returned">Returned</option>
          </select>
        </div>
        <div class="book-list" id="bookList"></div>
        <p class="empty" id="emptyState">No books match your search.</p>
      </section>
    </section>
  </main>

  <script>
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const sampleDate = new Date(today);
    sampleDate.setDate(today.getDate() + 3);
    const books = [
      { id: 1, title: "The Midnight Library", author: "Matt Haig", borrower: "Asha", due: toDate(sampleDate), returned: false },
      { id: 2, title: "Atomic Habits", author: "James Clear", borrower: "Vikram", due: "2026-08-18", returned: false },
      { id: 3, title: "A Brief History of Time", author: "Stephen Hawking", borrower: "Meera", due: "2026-08-12", returned: true }
    ];

    const form = document.getElementById("bookForm");
    const list = document.getElementById("bookList");
    const emptyState = document.getElementById("emptyState");
    const search = document.getElementById("search");
    const filter = document.getElementById("filter");

    function toDate(date) { return date.toISOString().slice(0, 10); }
    function getState(book) {
      if (book.returned) return "Returned";
      const due = new Date(book.due + "T00:00:00");
      const days = Math.ceil((due - today) / 86400000);
      return days < 0 ? "Overdue" : days <= 7 ? "Due soon" : "Borrowed";
    }
    function formatDate(value) { return new Date(value + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }
    function render() {
      const term = search.value.toLowerCase().trim();
      const chosen = filter.value;
      const visible = books.filter(book => {
        const matchesText = [book.title, book.author, book.borrower].join(" ").toLowerCase().includes(term);
        return matchesText && (chosen === "All" || getState(book) === chosen);
      });
      list.innerHTML = visible.map(book => {
        const state = getState(book);
        const stateClass = state === "Returned" ? "returned" : state === "Overdue" ? "overdue" : "";
        return `<article class="book ${stateClass}">
          <div><h3 class="book-title">${escapeHtml(book.title)}</h3><p class="book-author">by ${escapeHtml(book.author)}</p>
          <div class="meta"><span>Borrower: ${escapeHtml(book.borrower)}</span><span>Due: ${formatDate(book.due)}</span></div></div>
          <span class="status status-${state.toLowerCase().replace(" ", "-")}">${state}</span>
          <div class="book-actions">${!book.returned ? `<button class="return-btn" onclick="markReturned(${book.id})">Mark returned</button>` : ""}<button class="delete-btn" onclick="removeBook(${book.id})">Remove</button></div>
        </article>`;
      }).join("");
      emptyState.hidden = visible.length !== 0;
      document.getElementById("borrowedCount").textContent = books.filter(book => !book.returned).length;
      document.getElementById("dueSoonCount").textContent = books.filter(book => getState(book) === "Due soon").length;
      document.getElementById("overdueCount").textContent = books.filter(book => getState(book) === "Overdue").length;
      document.getElementById("returnedCount").textContent = books.filter(book => book.returned).length;
    }
    function escapeHtml(value) { return value.replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[character])); }
    function markReturned(id) { const book = books.find(item => item.id === id); if (book) { book.returned = true; render(); } }
    function removeBook(id) { const index = books.findIndex(book => book.id === id); if (index !== -1 && confirm("Remove this loan record?")) { books.splice(index, 1); render(); } }
    form.addEventListener("submit", event => {
      event.preventDefault();
      books.unshift({ id: Date.now(), title: title.value.trim(), author: author.value.trim(), borrower: borrower.value.trim(), due: returnDate.value, returned: false });
      form.reset();
      render();
    });
    search.addEventListener("input", render);
    filter.addEventListener("change", render);
    render();
  </script>
</body>
</html>
